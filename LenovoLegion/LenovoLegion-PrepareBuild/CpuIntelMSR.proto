edition = "2024";

package legion.messages;

import "UiOptions.proto";


message CpuIntelMSR
{
    message VoltageSettings
    {
        uint32  max_overvolt    = 1 [(legion.ui.field) = { widget: HIDDEN }];
        uint32  max_undervolt   = 2 [(legion.ui.field) = { widget: HIDDEN }];
        int32   offset          = 3 [(legion.ui.field) = { unit: "mV", widget: SLIDER, scale: 0.001, min: "-max_undervolt", max: "max_overvolt", supported_from: "supported" }];   // uV
        bool    supported       = 4 [(legion.ui.field) = { widget: HIDDEN }];
    }

    VoltageSettings   analogio                       = 1 [(legion.ui.field) = { label: "AnalogIo" }];
    VoltageSettings   cache                          = 2 [(legion.ui.field) = { label: "Cache" }];
    VoltageSettings   cpu                            = 3 [(legion.ui.field) = { label: "Core" }];
    VoltageSettings   gpu                            = 4 [(legion.ui.field) = { label: "GPU" }];
    VoltageSettings   uncore                         = 5 [(legion.ui.field) = { label: "Uncore" }];
}
