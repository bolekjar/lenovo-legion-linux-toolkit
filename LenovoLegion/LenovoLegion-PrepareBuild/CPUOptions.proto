edition = "2024";

package legion.messages;

import "UiOptions.proto";


message CPUOptions
{
    message CPUX
    {
        // Governor is sent only for online CPUs, allowed values from available_governors (split by spaces)
        string   governor             =1 [(legion.ui.field) = { label: "Governor", widget: COMBO, choices_from: "available_governors" }];
        string   available_governors  =2 [(legion.ui.field) = { widget: HIDDEN }];
        bool     cpu_online           =3 [(legion.ui.field) = { label: "Enabled" }];
        uint32   cpu_core_id          =4 [(legion.ui.field) = { label: "CoreId", widget: LABEL }];
        uint32   die_id               =5 [(legion.ui.field) = { label: "DieId", widget: LABEL }];
        uint32   physical_package_id  =6 [(legion.ui.field) = { label: "PackageId", widget: LABEL }];
        uint32   cluster_id           =7 [(legion.ui.field) = { label: "ClusterId", widget: LABEL }];
    }

    repeated CPUX cpus = 1;
}

message CPUSMT
{
    bool   active  = 1 [(legion.ui.field) = { widget: HIDDEN }];
    string control = 2 [(legion.ui.field) = { label: "SMT", widget: COMBO, choices_from: "settable_controls" }];

    // Values of control which can be set now (read-only), empty = SMT can not be switched
    repeated string settable_controls = 3 [(legion.ui.field) = { widget: HIDDEN }];
}


// Labels and order of the fields the same as OtherControl.ui ("Performace" of the original corrected)
message CPUPState
{
    uint32  min_perf_pct      = 3 [(legion.ui.field) = { label: "MIN Performance limit", unit: "%", widget: SPIN, min: "0", max: "max_perf_pct",
                                    tooltip: "This file dictates the minimum allowed frequency (P-state) that the intel_pstate driver can drop to, expressed as a percentage of the maximum hardware capability." }];
    uint32  max_perf_pct      = 2 [(legion.ui.field) = { label: "MAX Performance limit", unit: "%", widget: SPIN, min: "min_perf_pct", max: "100",
                                    tooltip: "Maximum performance limit for your CPU, working hand-in-hand with the no_turbo switch.\nControls the maximum allowed frequency (P-state) as a percentage of the total hardware capability." }];
    bool    no_turbo          = 4 [(legion.ui.field) = { label: "Disable Turbo",
                                    tooltip: "Is the standard, used in the Linux kernel to control Turbo Boost." }];
    bool    hwp_dynamic_boost = 1 [(legion.ui.field) = { label: "HWP Dynamic boost",
                                    tooltip: "When enabled, this feature briefly and dynamically boosts processor performance (P-state) the moment a task resumes after waiting for disk or network operations to complete (I/O wait).\n\nThe Goal: To speed up system responsiveness. While the processor is waiting for data from the disk, it runs at a low frequency to save power. As soon as the disk delivers the data, HWP Dynamic Boost immediately \"pushes\" the processor to a higher clock speed so the data can be processed without any stutter.\n\nWhen it is useful: It helps primarily with applications that read and write heavily to the disk, or network services where the lowest possible response time (latency) matters." }];
    string  status            = 5 [(legion.ui.field) = { label: "Mode", widget: COMBO, choices_from: "settable_statuses",
                                    tooltip: "🟢 Active Mode (Default for Modern CPUs) - In this mode, the Linux kernel hands over frequency scaling control directly to the processor's hardware (HWP - Hardware P-States).\n🔵 Passive Mode - In this mode, the driver operates similarly to older, generic scaling drivers (like acpi-cpufreq)." }];

    // Values of status which can be set now (read-only), empty = status can not be changed
    repeated string settable_statuses = 6 [(legion.ui.field) = { widget: HIDDEN }];

    string  energy_performance_preference = 7 [(legion.ui.field) = { label: "Energy Performance Preference", widget: COMBO, choices_from: "available_energy_performance_preferences",
                                    tooltip: "Energy Performance Preference (EPP): a hint for the processor how to balance the performance and the power when it selects the frequency itself (active mode, HWP / CPPC).\n🔴 performance - the highest frequencies at once, the fastest response, the highest power and temperature.\n🟠 balance_performance - fast, but saves power while idle (a good default on the charger).\n🟢 balance_power - noticeably lower power and temperature, a slightly slower response (a good default on the battery).\n🔵 power - the lowest power, the CPU runs slower.\n⚪ default - the value of the firmware.\n🔄 dynamic - the kernel changes the EPP by the platform profile and the power source (newer kernels).\n\nOnly in the active mode, applied to all threads. With the governor performance the kernel allows only performance, the other values need the governor powersave (CPU Freq Control)." }];

    // EPP values the kernel offers now (active mode only, depends on the governor), without "custom" (a raw number, not writable)
    repeated string available_energy_performance_preferences = 8 [(legion.ui.field) = { widget: HIDDEN }];
}


// AMD P-State (amd-pstate): mode of the driver, boost and the energy performance preference of all policies
message CPUAmdPState
{
    string status = 1 [(legion.ui.field) = { label: "Mode", widget: COMBO, choices_from: "settable_statuses",
                       tooltip: "🟢 Active - the processor selects the frequency itself (CPPC autonomous mode) guided by the energy performance preference.\n🔵 Guided - the kernel governor sets the minimum and maximum performance, the processor selects the frequency in this range.\n⚪ Passive - the kernel governor (schedutil, ...) selects the performance level." }];

    // Values of status which can be set now (read-only)
    repeated string settable_statuses = 2 [(legion.ui.field) = { widget: HIDDEN }];

    bool   boost = 3 [(legion.ui.field) = { label: "Boost",
                      tooltip: "The processor may run above its base frequency (Precision Boost). Disabled: lower power and temperature, lower performance." }];

    string energy_performance_preference = 4 [(legion.ui.field) = { label: "Energy Performance Preference", widget: COMBO, choices_from: "available_energy_performance_preferences",
                                              tooltip: "Energy Performance Preference (EPP): a hint for the processor how to balance the performance and the power when it selects the frequency itself (active mode, HWP / CPPC).\n🔴 performance - the highest frequencies at once, the fastest response, the highest power and temperature.\n🟠 balance_performance - fast, but saves power while idle (a good default on the charger).\n🟢 balance_power - noticeably lower power and temperature, a slightly slower response (a good default on the battery).\n🔵 power - the lowest power, the CPU runs slower.\n⚪ default - the value of the firmware.\n🔄 dynamic - the kernel changes the EPP by the platform profile and the power source (newer kernels).\n\nOnly in the active mode, applied to all threads. With the governor performance the kernel allows only performance, the other values need the governor powersave (CPU Freq Control)." }];

    // EPP values the kernel offers now (active mode only, depends on the governor), without "custom" (a raw number, not writable)
    repeated string available_energy_performance_preferences = 5 [(legion.ui.field) = { widget: HIDDEN }];

    string prefcore = 6 [(legion.ui.field) = { label: "Preferred Core", widget: LABEL,
                         tooltip: "The scheduler prefers the fastest cores of the processor (amd_pstate prefcore, read only)." }];
}


// Intel uncore frequency (intel_uncore_frequency): the frequency of the ring bus, the last level cache and the memory
// controller of all packages / dies; frequencies in kHz, shown in MHz
message CPUUncore
{
    uint32 min_freq     = 1 [(legion.ui.field) = { label: "Minimal uncore frequency", unit: "MHz", widget: SLIDER, scale: 0.001, min: "min_limit", max: "max_freq",
                             tooltip: "The lowest frequency of the uncore: the ring bus between the cores, the last level cache (L3) and the memory controller.\n\nA higher minimum lowers the latency of the memory and the cache (games, audio) at the cost of a higher power in idle. The default is the lowest value of the hardware." }];
    uint32 max_freq     = 2 [(legion.ui.field) = { label: "Maximal uncore frequency", unit: "MHz", widget: SLIDER, scale: 0.001, min: "min_freq", max: "max_limit",
                             tooltip: "The highest frequency of the uncore (ring bus, L3 cache, memory controller).\n\nA lower maximum saves several watts which the cores can use instead (more boost within the same power limit) or which save the battery; memory and cache heavy work gets slower. The default is the highest value of the hardware." }];
    uint32 current_freq = 3 [(legion.ui.field) = { label: "Current uncore frequency", unit: "MHz", widget: LABEL, scale: 0.001,
                             tooltip: "The frequency the uncore runs now (read when the page was loaded)." }];

    // Limits of the hardware (initial_min_freq_khz, initial_max_freq_khz)
    uint32 min_limit    = 4 [(legion.ui.field) = { widget: HIDDEN }];
    uint32 max_limit    = 5 [(legion.ui.field) = { widget: HIDDEN }];
}


// Intel TCC offset (processor thermal device): the CPU throttles at TjMax - offset
message CPUTcc
{
    uint32 offset     = 1 [(legion.ui.field) = { label: "TCC offset", unit: "°C", widget: SLIDER, min: "0", max: "max_offset",
                           tooltip: "Thermal Control Circuit offset: the processor starts to throttle (lowers its frequency) at TjMax minus this offset instead of at TjMax.\n\nA higher offset keeps the CPU cooler and the fans quieter at the cost of the performance under a long load; 0 lets the CPU reach TjMax. It works independently of the power limits and of the temperature limit of the power mode.\n\nThe firmware of some notebooks sets its own offset when the power mode changes; the value is set again with the saved settings." }];
    uint32 limit      = 2 [(legion.ui.field) = { label: "Throttling temperature", unit: "°C", widget: LABEL,
                           tooltip: "TjMax - TCC offset: the temperature at which the processor starts to throttle." }];
    uint32 tjmax      = 3 [(legion.ui.field) = { label: "TjMax", unit: "°C", widget: LABEL,
                           tooltip: "The highest allowed temperature of the processor (Tj max, coretemp)." }];

    // Highest offset offered (the throttling temperature stays at least 50 °C, at most 63 °C of the hardware)
    uint32 max_offset = 4 [(legion.ui.field) = { widget: HIDDEN }];
}
