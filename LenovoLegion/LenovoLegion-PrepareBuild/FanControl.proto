edition = "2024";

package legion.messages;

import "UiOptions.proto";



message FanOption
{
    message Option {
        bool       current_value  = 1;
        bool       default_value  = 2 [(legion.ui.field) = { widget: HIDDEN }];
        bool       supported      = 3 [(legion.ui.field) = { widget: HIDDEN }];
    }

    Option full_speed = 1 [(legion.ui.field) = { label: "Fan full speed", supported_from: "full_speed.supported" }];
}


message FanCurve
{
    // Levels of the points (index level - 1 of the fan speeds of the default tables), the curve is monotonic
    // (FanCurveEditor). The limits of the points are of the firmware (min_value / max_value), min / max here only
    // without them (older kernel module). The editor labels the points by the sensor temperatures of the default
    // tables, the labels here only without them (older firmware).
    message Points
    {
        uint32 point1   =  1 [(legion.ui.field) = { label: "Low", widget: SLIDER, min: "1", max: "10" }];
        uint32 point2   =  2 [(legion.ui.field) = { label: "20%", widget: SLIDER, min: "1", max: "10" }];
        uint32 point3   =  3 [(legion.ui.field) = { label: "30%", widget: SLIDER, min: "1", max: "10" }];
        uint32 point4   =  4 [(legion.ui.field) = { label: "40%", widget: SLIDER, min: "1", max: "10" }];
        uint32 point5   =  5 [(legion.ui.field) = { label: "50%", widget: SLIDER, min: "1", max: "10" }];
        uint32 point6   =  6 [(legion.ui.field) = { label: "60%", widget: SLIDER, min: "1", max: "10" }];
        uint32 point7   =  7 [(legion.ui.field) = { label: "70%", widget: SLIDER, min: "1", max: "10" }];
        uint32 point8   =  8 [(legion.ui.field) = { label: "80%", widget: SLIDER, min: "1", max: "10" }];
        uint32 point9   =  9 [(legion.ui.field) = { label: "90%", widget: SLIDER, min: "1", max: "10" }];
        uint32 point10  =  10 [(legion.ui.field) = { label: "High", widget: SLIDER, min: "1", max: "10" }];
    }

    message Default
    {
        repeated uint32 fan     = 1;
        repeated uint32 sensors = 2;
    }

    // The kernel accepts only the whole curve: changed points are sent with the other points (atomic)
    Points current_value                 = 1 [(legion.ui.field) = { atomic: true }];

    /*
     * Default Fan Curves for different modes - Legion 5/7 2021+
     */
    map<uint32, Default>  cpu_default    = 2 [(legion.ui.field) = { widget: HIDDEN }];
    map<uint32, Default>  gpu_default    = 3 [(legion.ui.field) = { widget: HIDDEN }];

    /*
     * Fan Optionals
     */
    map<uint32, Default>  cpusen_default = 4 [(legion.ui.field) = { widget: HIDDEN }];
    map<uint32, Default>  sys_default    = 5 [(legion.ui.field) = { widget: HIDDEN }];

    /*
     * Limits of the levels of the points of the firmware (fan table data: the points of the adjust ranges may only
     * be raised / lowered from the default curve 1..10), the EC does not check them: a curve under them runs
     * the fans at the minimal speed under load (measured on Legion Pro 7 16IAX10H). Not set by an older kernel module.
     */
    repeated uint32       min_value      = 6 [(legion.ui.field) = { widget: HIDDEN }];
    repeated uint32       max_value      = 7 [(legion.ui.field) = { widget: HIDDEN }];

}
