edition = "2024";

package legion.messages;

import "UiOptions.proto";


message Notification
{
    enum SpecialKey
    {
        UKNOWN                  = 0;
        FNF9                    = 1;
        FNLOCKON                = 2;
        FNLOCKOFF               = 3;
        FNPRTSC                 = 4;
        FNPRTSC2                = 45;
        CAMERAON                = 12;
        CAMERAOFF               = 13;
        FNR                     = 16;
        FNR2                    = 0x0041002A;
        SPECTRUMBACKLIGHTOFF    = 24;
        SPECTRUMBACKLIGHT1      = 25;
        SPECTRUMBACKLIGHT2      = 26;
        SPECTRUMBACKLIGHT3      = 38;
        SPECTRUMPRESET1         = 32;
        SPECTRUMPRESET2         = 33;
        SPECTRUMPRESET3         = 34;
        SPECTRUMPRESET4         = 35;
        SPECTRUMPRESET5         = 36;
        SPECTRUMPRESET6         = 37;
        FNN                     = 42;
        LOGOBACKLIGHTON         = 43;
        LOGOBACKLIGHTOFF        = 44;
        FNF4                    = 62;
        FNF8                    = 63;
        WHITEBACKLIGHTOFF       = 64;
        WHITEBACKLIGHT1         = 65;
        WHITEBACKLIGHT2         = 66;
    }

    enum KeylockDisabledBit
    {
        ALL_ENABLED     = 0x00000000;
        WINDOWS_KEY     = 0x00000001;
        TOUCHPAD_KEY    = 0x00000002;
    };

    // (legion.ui.reload): the data types the GUI reads again after the notification, the others are not changed by it;
    // without the option (driver added / removed) all data types are read again
    enum Action {
        LENOVO_DRIVER_ADDED                     = 0;
        LENOVO_DRIVER_REMOVED                   = 1;
        THERMAL_MODE_CHANGE                     = 2 [(legion.ui.reload) = "POWER_PROFILE,CPU_POWER,GPU_POWER,FAN_CURVE,FAN_OPTION"];
        POWER_SUPPLY_BATTERY0_CHANGE            = 3 [(legion.ui.reload) = "BATTERY,CPU_POWER,GPU_POWER"];
        CPU_X_LIST_RELOADED                     = 4 [(legion.ui.reload) = "CPU_OPTIONS,CPU_FREQUENCY,CPU_TOPOLOGY,CPU_SMT"];
        KEYLOCK_STATUS_CHANGE                   = 5 [(legion.ui.reload) = "OTHER"];
        SPECIAL_KEY_PRESSED                     = 6 [(legion.ui.reload) = "RGB_CONTROLLER,OTHER"];
        POWER_CONTROL_CHANGED                   = 7 [(legion.ui.reload) = "CPU_POWER,GPU_POWER"];
        CPU_OFFSET_CHANGED                      = 8 [(legion.ui.reload) = "CPU_INTEL_MSR"];
        FAN_CURVE_CHANGED                       = 9 [(legion.ui.reload) = "FAN_CURVE,FAN_OPTION"];
        CPU_FREQUENCY_CHANGED                   = 10 [(legion.ui.reload) = "CPU_FREQUENCY"];
        CPU_PSTATE_CHANGED                      = 11 [(legion.ui.reload) = "CPU_PSTATE,CPU_OPTIONS,CPU_FREQUENCY"];
        VPC_FEATURE_CHANGED                     = 12 [(legion.ui.reload) = "OTHER"];   // conservation mode, USB charging, Fn lock, camera power (written by another client)
    }


    message RGBControlerScreenShotDataParams
    {
        uint32          width       = 1;
        uint32          height      = 2;
    }

    Action                               action                                  = 1;
    SpecialKey                           special_key                             = 2;
    KeylockDisabledBit                   key_lock_key                            = 3;
}
