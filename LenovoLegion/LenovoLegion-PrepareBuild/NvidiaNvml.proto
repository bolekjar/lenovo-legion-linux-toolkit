edition = "2024";

package legion.messages;

import "UiOptions.proto";


message NvidiaNvml
{
    message HardwareMonitor {

        message MinMaxValue {
            uint32 value       = 1;
            uint32 min_value   = 2;
            uint32 max_value   = 3;
        }

        message Temperature {
            uint32  value           = 1;
            uint32  slowdown        = 3;
            uint32  shutdown        = 4;
        }

        message MemoryUse {
            uint64  used        = 1;
            uint64  total       = 2;
            uint64  free        = 3;
        }

        message Power {
            uint32  value           = 1;
            uint32  min_value       = 2;
            uint32  max_value       = 3;
            uint32  default_value   = 4;
            uint32  enforced_value  = 5;
            uint64  total           = 6;
        }

        message PCIe {
            uint32  generation      = 1;
            uint32  generation_max  = 2;
            uint32  width           = 3;
            uint32  width_max       = 4;
            uint64  rx_bytes        = 5;
            uint64  tx_bytes        = 6;
        }


        MinMaxValue  gpu_utilization     =1;
        MinMaxValue  memory_utilization  =2;
        Temperature  temperature         =3;
        MemoryUse    memory_use          =4;
        MinMaxValue  gpu_clock           =5;
        MinMaxValue  memory_clock        =6;
        MinMaxValue  sm_clock            =7;
        Power  power                     =8;
        PCIe   pcie                      =9;
    }

    // Range of NVML (nvmlDeviceGetGpcClkMinMaxVfOffset / MemClk), the minimum is negative: int32
    // (was uint32, the same varint on the wire, the lower 32 bits are the same)
    message OffsetSettings {
        int32   max                  = 1 [(legion.ui.field) = { widget: HIDDEN }];
        int32   min                  = 2 [(legion.ui.field) = { widget: HIDDEN }];
        int32   value                = 3 [(legion.ui.field) = { widget: SLIDER, min: "min", max: "max", step: 10 }];   // step of OffsetsControl
    }

    HardwareMonitor   hardware_monitor   = 1 [(legion.ui.field) = { widget: HIDDEN }];
    OffsetSettings    gpu_offset         = 2 [(legion.ui.field) = { label: "GPU Clock Offset", unit: "MHz" }];
    OffsetSettings    memory_offset      = 3 [(legion.ui.field) = { label: "Memory Clock Offset", unit: "MHz" }];


    string name                          = 4 [(legion.ui.field) = { widget: HIDDEN }];

    // GPU is in runtime D3 (power/runtime_status "suspended"), it is not queried (NVML would wake it up):
    // hardware_monitor contains only static data, offsets are the last known values
    bool   gpu_suspended                 = 5 [(legion.ui.field) = { widget: HIDDEN }];
}


// Runtime power management of the discrete NVIDIA GPU (PCI power/control and power/runtime_status): the GPU is powered
// down when it is idle (hybrid mode); the NVIDIA driver enables it itself (DynamicPowerManagement, udev rule)
message GpuRuntimePM
{
    // A discrete NVIDIA GPU was found (sent only then)
    bool   present        = 1 [(legion.ui.field) = { widget: HIDDEN }];

    bool   auto_suspend   = 2 [(legion.ui.field) = { label: "Power down when idle",
                               tooltip: "Runtime power management of the discrete GPU (PCI power/control = auto): in the hybrid mode the GPU is powered down when no application uses it, which saves 5 - 15 W on the battery.\n\nThe NVIDIA driver enables it itself (DynamicPowerManagement); disabled (on) the GPU stays powered all the time. Keep it enabled unless you debug a problem of the GPU." }];
    string runtime_status = 3 [(legion.ui.field) = { label: "State", widget: LABEL,
                               tooltip: "active: the GPU is powered (an application uses it, or the power management is disabled)\nsuspended: the GPU is powered down (saves power)\nIn the dGPU only mode (G-Sync) the GPU drives the display and is always active." }];
    string device         = 4 [(legion.ui.field) = { label: "PCI device", widget: LABEL,
                               tooltip: "PCI address of the discrete GPU." }];
}
