edition = "2024";

package legion.messages;

import "UiOptions.proto";


message CPUPower
{
    message Limit
    {
        // Range, steps and support from the descriptor of the custom mode (255), the same as the daemon (settableLimit) and the widget pages
        uint32 current_value        = 1 [(legion.ui.field) = { widget: SLIDER, min: "mode_descriptor_map[255].min_value", max: "mode_descriptor_map[255].max_value", choices_from: "mode_descriptor_map[255].steps", supported_from: "mode_descriptor_map[255].supported" }];

        message Descriptor {

            uint32 default_value                = 1;
            uint32 display_name                 = 2;
            uint32 min_value                    = 3;
            uint32 max_value                    = 4;
            uint32 scalar_increment             = 5;
            repeated uint32 steps               = 6;
            uint32 type                         = 7;
            uint32 supported                    = 8;
        }

        map<int32, Descriptor> mode_descriptor_map = 2 [(legion.ui.field) = { widget: HIDDEN }];
    }

    // Peak power and APU sPPT: sent by the daemon only on the older firmware (legacy CPU method), hidden otherwise
    Limit apus_pptp_limit           = 1 [(legion.ui.field) = { label: "APU sPPT Power Limit", unit: "W", tooltip: "Slow package power tracking limit of the APU (AMD): the power the processor may consume over a short averaging period." }];
    Limit cpu_clp_limit             = 2 [(legion.ui.field) = { label: "Long Term Power Limit (Cross Loading)", unit: "W", tooltip: "The setting value of maximum CPU power consumption when CPU and GPU are simultaneously fully loaded; the higher the value, the stronger the CPU performance, and the greater heat dissipation capacity required.\n\nAMD: sets the sustained power limit (SPL / STAPM) while the firmware uses its cross loading table (CPU and GPU loaded), otherwise the Platform Long Term Power Limit sets it. Use the same value for both for a predictable limit." }];
    Limit cpu_ltp_limit             = 3 [(legion.ui.field) = { label: "Platform Long Term Power Limit", unit: "W", tooltip: "The setting value of maximum power consumption during continuous operation with pure CPU or AMD Smart Shift System load. The higher the value, the greater the performance of the CPU or System and the greater heat dissipation capacity required.\n\nAMD: the sustained power limit (SPL / STAPM), averaged by the processor over minutes (the power may stay at the short term limit for minutes); while the firmware uses its cross loading table (CPU and GPU loaded) the Cross Loading limit sets it instead. Use the same value for both for a predictable limit." }];
    Limit cpu_pl1_tau               = 4 [(legion.ui.field) = { label: "PL1 Tau", unit: "s", tooltip: "PL1 power consumption start time." }];
    Limit cpu_pp_limit              = 5 [(legion.ui.field) = { label: "Peak Power Limit", unit: "W", tooltip: "The highest power the CPU may reach for a very short time (above the short term power limit).\n\nAMD: the fast package power tracking limit (fast PPT)." }];
    Limit cpu_stp_limit             = 6 [(legion.ui.field) = { label: "Platform Short Term Power Limit", unit: "W", tooltip: "The peak power consumption that can be reached within a short time with pure CPU or AMD Smart Shift System load. The higher the value, the higher the instantaneous performance of the CPU or System.\n\nAMD: the slow package power tracking limit (slow PPT)." }];
    Limit cpu_tmp_limit             = 7 [(legion.ui.field) = { label: "Temperature limit", unit: "°C", tooltip: "When the core reaches the temperature set in the thermal wall, it will automatically limit the frequency to control the temperature; this option can be used to limit the power consumption of the CPU.\n\nAMD: the Tctl temperature limit." }];
    Limit gpu_to_cpu_dynamic_boost  = 8 [(legion.ui.field) = { label: "GPU to CPU Dynamic Boost", unit: "W", tooltip: "This is the maximum additional power that can be allocated to the CPU from the GPU based on CPU usage. The higher the value, the better the performance of applications that use the CPU." }];
    Limit gpu_total_onac            = 9 [(legion.ui.field) = { label: "Total Processor Power Target In AC", unit: "W", tooltip: "The point at which the CPU triggers dynamic power consumption adjustment for the graphics card. Use this point as the setting value at which CPU and GPU dynamic power allocation begins." }];
}
