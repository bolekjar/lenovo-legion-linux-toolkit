# Drivers of the kernel bound to the same devices as lenovo_legion (only one driver binds a WMI GUID):
#  - ideapad_laptop (ideapad_acpi is its old name): WMI GUID 8FC0DE0C (Fn keys, used by the Legion events),
#  - lenovo_wmi_*: WMI game zone, other mode, capability data and the thermal mode event (kernel 6.16+).
# lenovo_wmi_hotkey_utilities (mic mute and audio mute LEDs) is not blacklisted: its WMI GUID is not used by
# lenovo_legion.
blacklist ideapad_acpi
blacklist ideapad_laptop
blacklist lenovo_wmi_events
blacklist lenovo_wmi_other
blacklist lenovo_wmi_capdata01
blacklist lenovo_wmi_gamezone
blacklist lenovo_wmi_helpers
blacklist lenovo_wmi_capdata
