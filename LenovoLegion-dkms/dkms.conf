PACKAGE_NAME="LenovoLegion"
# Replaced by the version of the package (PKGBUILD), also the version of the modules (MODULE_VERSION)
PACKAGE_VERSION="DKMS_VERSION"
MAKE[0]="make KERNEL_VERSION=${kernelver} LEGION_VERSION=${PACKAGE_VERSION}"
CLEAN="make KERNEL_VERSION=${kernelver} clean"
BUILT_MODULE_NAME[0]="lenovo_legion"
AUTOINSTALL="yes"
# Minimal supported kernel 6.12 (legion-kernel-version.h)
BUILD_EXCLUSIVE_KERNEL="^(6\.(1[2-9]|[2-9][0-9])|[7-9]|[1-9][0-9]+)\."
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"
BUILT_MODULE_NAME[1]="legion_intel_msr"
DEST_MODULE_LOCATION[1]="/kernel/drivers/platform/x86"
